<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studovna u Drobka – živá tapeta</title>
<!-- Živá tapeta pro Windows 11 (Lively Wallpaper): odpočet do meetingu a stav sudu.
     Jen čte data (stejně jako aplikace), nic nezapisuje. Navrženo pro 4K, škáluje se na každou obrazovku. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0a0c10;--card:rgba(255,255,255,.04);--card-2:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
    --txt:#f2f3f5;--txt-2:#b0b8c2;--amber:#f5b942;--amber-2:#e8762d;--red:#ff6b6b;--green:#3ddc84;--grad:linear-gradient(135deg,#f5b942,#e8762d)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Inter,sans-serif;user-select:none}
  /* scéna 1920×1080 se zvětší na celou obrazovku (4K = 2×) – vše je vektor, takže ostré */
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  .bg{position:absolute;inset:0;background:
     radial-gradient(900px 620px at 50% 52%,rgba(245,185,66,.13),transparent 70%),
     radial-gradient(700px 500px at 90% 95%,rgba(232,118,45,.13),transparent 70%),
     radial-gradient(600px 420px at 6% 4%,rgba(57,135,229,.07),transparent 70%),
     radial-gradient(1400px 900px at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
  .bub{position:absolute;bottom:-60px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,rgba(255,248,225,.9) 0 10%,rgba(245,185,66,.16) 22%,rgba(245,185,66,.05) 70%);
    border:1.5px solid rgba(250,205,120,.45);box-shadow:0 0 14px rgba(245,185,66,.12);animation:rise linear infinite}
  @keyframes rise{from{transform:translate(0,0)}50%{transform:translate(14px,-600px)}to{transform:translate(-6px,-1220px)}}
  .tally{position:absolute;opacity:.06}
  .tally line{stroke:#f5b942;stroke-width:9;stroke-linecap:round}

  .head{position:absolute;left:0;right:0;top:70px;display:flex;align-items:center;justify-content:center;gap:22px}
  .logo{filter:drop-shadow(0 12px 30px rgba(232,118,45,.35));transition:transform .4s ease}
  .head:hover .logo{transform:rotate(-12deg) scale(1.06)}
  .title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:72px;letter-spacing:-.03em;line-height:1}
  .title .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .kicker{margin-top:10px;font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--txt-2);display:flex;gap:10px;align-items:center}
  .kicker i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}

  .count{position:absolute;left:50%;top:268px;transform:translateX(-50%);width:1180px;text-align:center;
    background:rgba(18,21,27,.72);border:1px solid var(--line-2);border-radius:34px;padding:40px 60px 44px;
    box-shadow:0 40px 100px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .3s,box-shadow .3s}
  .count:hover{border-color:rgba(245,185,66,.45);box-shadow:0 40px 100px rgba(0,0,0,.55),0 0 0 6px rgba(245,185,66,.06)}
  .lbl{font-size:20px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-2)}
  .clock{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:118px;letter-spacing:-.02em;line-height:1.08;margin:8px 0 6px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
  .when{font-size:27px;color:var(--txt-2)}
  .when .sess-day{color:var(--red);font-weight:700;text-transform:capitalize}
  .lower{margin-top:30px;padding-top:30px;border-top:1px solid var(--line);display:flex;justify-content:center;align-items:center;gap:36px}
  .keg-line{font-size:20px;color:var(--txt-2);line-height:1.45;flex:1 1 auto;min-width:0}
  .keg-line:empty{display:none}
  .keg-line b{color:var(--amber);font-weight:700}
  .keg-when{color:var(--txt);font-weight:600;white-space:nowrap}
  .nw{white-space:nowrap}
  .kegbox{display:grid;grid-template-columns:190px 1fr;gap:26px;align-items:center;text-align:left;max-width:820px;margin:0 auto}
  .keg-gauge svg{width:100%;height:auto;display:block;overflow:visible}
  .kg-liq,.kg-lvl{transition:transform 1.2s cubic-bezier(.3,.7,.2,1),opacity .3s ease}
  .kg-t1{stroke:rgba(255,255,255,.6);stroke-width:1.4}
  .kg-t2{stroke:rgba(255,255,255,.3);stroke-width:1}
  .kg-tl{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;fill:rgba(255,255,255,.65)}
  .kg-unit{font-size:9px;fill:rgba(255,255,255,.45)}
  .kg-lvt{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;fill:#fff}
  .kg-bub{fill:rgba(255,244,214,.6);animation:kgBub 3.2s ease-in-out infinite}
  @keyframes kgBub{0%,100%{opacity:.25}50%{opacity:.85}}
  .kegbox .keg-gauge{transition:transform .5s ease}
  .kegbox:hover .keg-gauge{transform:rotate(-4deg)}
  .kegbox:hover .kg-bub{animation-duration:.8s}
  .kegbox.low .keg-gauge svg{animation:kegWobble 2.6s ease-in-out infinite;transform-origin:50% 100%}
  .kegbox.low .kg-bub{animation-duration:.9s}
  @keyframes kegWobble{0%,62%,100%{transform:rotate(0)}68%{transform:rotate(-3deg)}76%{transform:rotate(2.5deg)}84%{transform:rotate(-1.5deg)}92%{transform:rotate(.8deg)}}
  .keg-info .kname{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--amber);font-size:30px;line-height:1.2}
  .keg-info .kmeta{margin-top:4px}
  .keg-info .kleft{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:54px;line-height:1.1;margin-top:12px;color:var(--txt)}
  .keg-info .kleft .kl-l,.keg-info .kleft span+span{font-size:.45em;font-weight:600;color:var(--txt-2)}
  .keg-info .kleft.keg-empty{color:var(--red)}
  .keg-info .kpace{margin-top:10px;color:var(--txt)}
  .keg-foot{margin-top:10px}
  .keg-alert{margin-top:14px;padding:12px 18px;border-radius:14px;font-weight:700;color:#ffd6d6;background:rgba(224,71,71,.14);
    border:1px solid rgba(255,107,107,.35);animation:kegPulse 1.6s ease-in-out infinite}
  @keyframes kegPulse{0%,100%{opacity:1}50%{opacity:.62}}

  .foot{position:absolute;left:0;right:0;bottom:54px;display:flex;justify-content:center;align-items:center;gap:22px}
  .live{font-size:15px;color:rgba(176,184,194,.7);display:flex;align-items:center;gap:9px}
  .live i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 2s ease-in-out infinite}
  .live.off i{background:var(--red);box-shadow:0 0 10px var(--red);animation:none}
  @keyframes blink{50%{opacity:.35}}
  /* koláč síně slávy v kartě vedle sudu (stejný jako v aplikaci) */
  .hall-pie{flex:none;width:430px;padding-left:36px;border-left:1px solid var(--line);display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:center;text-align:left}
  .hall-pie[hidden]{display:none}
  .hall-pie .hp-title{grid-column:1/-1;font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-2)}
  .hall-pie svg{width:170px;height:170px;display:block;overflow:visible}
  .hall-pie .hp-seg{cursor:pointer;transition:opacity .2s,transform .2s;transform-origin:95px 95px}
  .hall-pie.hl .hp-seg{opacity:.35}
  .hall-pie.hl .hp-seg.on{opacity:1;transform:scale(1.04)}
  .hall-pie .hp-c1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;fill:var(--txt)}
  .hall-pie .hp-c2{font-size:11.5px;fill:var(--txt-2)}
  .hp-legend{display:flex;flex-direction:column;gap:1px;min-width:0}
  .hp-li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;padding:4px 7px;border-radius:8px;cursor:pointer;font-size:15px}
  .hp-li:hover,.hp-li.on{background:var(--card-2)}
  .hp-sw{width:12px;height:12px;border-radius:4px}
  .hp-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--txt)}
  .hp-v{font-family:'Space Grotesk',sans-serif;color:var(--txt-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .hp-v b{color:var(--txt);font-weight:700}
  /* medaile síně slávy po krajích */
  .meds{position:absolute;top:268px;width:318px;display:flex;flex-direction:column;gap:14px}
  .meds.l{left:26px}.meds.r{right:26px}
  .meds .mt{font-size:14px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--txt-2);margin:0 0 2px 4px}
  .meds.r .mt{text-align:right;margin:0 4px 2px 0}
  .md{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line-2);border-radius:20px;
    background:rgba(18,21,27,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 18px 40px rgba(0,0,0,.4);
    transition:transform .25s ease,border-color .25s ease;animation:mdIn .6s ease both}
  .md:hover{transform:translateY(-4px) scale(1.02);border-color:rgba(245,185,66,.5)}
  .md-ico{font-size:36px;line-height:1;flex:none}
  .md>div{min-width:0}
  .md-lbl{font-size:14px;color:var(--txt-2);font-weight:600;letter-spacing:.02em}
  .md-who{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .md-val{font-size:15px;color:var(--txt-2);line-height:1.35}
  .md-val b{color:var(--amber);font-weight:700}
  @keyframes mdIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  /* dočasný vzkaz přes celou tapetu */
  #hey{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;
    background:radial-gradient(1100px 700px at 50% 50%,rgba(20,16,10,.82),rgba(10,12,16,.94));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  #hey.on{display:flex;animation:heyIn 1.2s ease both}
  #hey .h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:150px;letter-spacing:-.035em;line-height:1.02;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 20px 60px rgba(232,118,45,.35))}
  #hey .h2{margin-top:34px;font-size:42px;color:var(--txt)}
  #hey .h3{margin-top:18px;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt-2)}
  #hey .hl{animation:heyBounce 2.4s ease-in-out infinite}
  @keyframes heyIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  @keyframes heyBounce{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(-3deg)}}
  @media (prefers-reduced-motion:reduce){.bub,.kg-bub,.keg-alert,.live i,.kegbox.low .keg-gauge svg{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div>
  <div id="bubs"></div>
  <svg class="tally" style="left:-40px;top:640px" width="520" height="300" viewBox="0 0 520 300"><line x1="60" y1="40" x2="60" y2="260"/><line x1="140" y1="40" x2="140" y2="260"/><line x1="220" y1="40" x2="220" y2="260"/><line x1="300" y1="40" x2="300" y2="260"/><line x1="20" y1="230" x2="360" y2="70"/></svg>
  <svg class="tally" style="right:120px;top:-50px;transform:rotate(12deg)" width="420" height="260" viewBox="0 0 420 260"><line x1="60" y1="30" x2="60" y2="230"/><line x1="130" y1="30" x2="130" y2="230"/><line x1="200" y1="30" x2="200" y2="230"/></svg>

  <div class="head">
    <svg class="logo" width="120" height="104" viewBox="0 0 116 100" role="img" aria-label="Drobek – nakousnutá sušenka">
        <defs>
          <radialGradient id="ck" cx="38%" cy="32%" r="75%">
            <stop offset="0%" stop-color="#f3cd82"/><stop offset="60%" stop-color="#e3a850"/><stop offset="100%" stop-color="#cf913a"/>
          </radialGradient>
          <mask id="bite"><rect width="116" height="100" fill="#fff"/>
            <circle cx="92" cy="40" r="15" fill="#000"/><circle cx="86" cy="56" r="11" fill="#000"/><circle cx="96" cy="55" r="7" fill="#000"/></mask>
        </defs>
        <circle cx="48" cy="52" r="41" fill="url(#ck)" mask="url(#bite)"/>
        <g fill="#a8631f"><circle cx="33" cy="39" r="6.5"/><circle cx="55" cy="33" r="5"/><circle cx="60" cy="60" r="6"/><circle cx="38" cy="65" r="5.5"/><circle cx="47" cy="50" r="4"/><circle cx="26" cy="56" r="4.5"/><circle cx="68" cy="44" r="4"/></g>
        <g fill="#3a2c18"><ellipse cx="44" cy="30" rx="1.4" ry="3" transform="rotate(25 44 30)"/><ellipse cx="30" cy="47" rx="1.4" ry="3" transform="rotate(-15 30 47)"/><ellipse cx="52" cy="44" rx="1.4" ry="3" transform="rotate(40 52 44)"/><ellipse cx="42" cy="55" rx="1.4" ry="3" transform="rotate(-30 42 55)"/><ellipse cx="58" cy="52" rx="1.4" ry="3" transform="rotate(10 58 52)"/><ellipse cx="35" cy="72" rx="1.4" ry="3" transform="rotate(60 35 72)"/></g>
        <g fill="#e9bb68"><circle cx="103" cy="38" r="3.2"/><circle cx="110" cy="50" r="2.2"/><circle cx="105" cy="61" r="2.6"/><circle cx="113" cy="42" r="1.6"/></g>
      </svg>
    <div>
      <div class="title">Studovna <span class="g">u Drobka</span></div>
      <div class="kicker"><i></i>Hospodská tabule · od léta Páně 2019</div>
    </div>
  </div>

  <section class="count">
    <div class="lbl">Do dalšího meetingu zbývá</div>
    <div class="clock" id="clock">…</div>
    <div class="when" id="sessionWhen"></div>
    <div class="lower">
      <div class="keg-line" id="kegLine"></div>
      <div class="hall-pie" id="hallPie" hidden></div>
    </div>
  </section>

  <div class="meds l" id="medL"></div>
  <div class="meds r" id="medR"></div>

  <div id="hey" aria-live="polite">
    <div class="h1">Pecháček přišel,</div>
    <div class="h1 hl">hurá!</div>
    <div class="h2">🎉 🍻 🥳 🍻 🎉</div>
    <div class="h3">Studovna u Drobka · od léta Páně 2019</div>
  </div>

  <div class="foot">
    <span class="live" id="live"><i></i><span id="liveTxt">načítám…</span></span>
  </div>
</div>
<script>
const SUPABASE_URL="https://eizrqgpkfeixgqymorro.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_v-3SZCposiayKsQb_5mNNw_fpgjUZzK";
let sb=null; try{ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }catch(e){}
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,"0");
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const plBeer=n=>n===1?"pivo":(n>=2&&n<=4?"piva":"piv");
const DAY_NAMES=["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"];
const DAY_IN=["v neděli","v pondělí","v úterý","ve středu","ve čtvrtek","v pátek","v sobotu"];
const L_LARGE=0.5, L_SMALL=0.3, MIN=60000, HOUR=3600000;
const fmtHM=ts=>{ const d=new Date(ts); return d.getHours()+":"+p2(d.getMinutes()); };
function setHTML(el,html){ if(el.__h!==html){ el.__h=html; el.innerHTML=html; } }
const KG={X:14,Y:22,W:60,H:116};
function kegGaugeSVG(size){
  const {X,Y,W,H}=KG, step=size>=40?10:5;
  let ticks="";
  for(let v=0; v<=size+1e-6; v+=step/2){
    const y=(Y+H*(1-v/size)).toFixed(1), major=Math.abs(v/step-Math.round(v/step))<1e-6;
    ticks+='<line x1="'+(X+W+9)+'" y1="'+y+'" x2="'+(X+W+(major?18:14))+'" y2="'+y+'" class="'+(major?"kg-t1":"kg-t2")+'"/>';
    if(major) ticks+='<text x="'+(X+W+21)+'" y="'+(+y+3.5)+'" class="kg-tl">'+fmtLiters(v)+'</text>';
  }
  const bub=[[26,.3],[38,.62],[50,.2],[32,.82],[46,.5],[57,.72],[29,.95]]
    .map(([x,f],i)=>'<circle class="kg-bub" style="animation-delay:-'+(i*0.7).toFixed(1)+'s" cx="'+x+'" cy="'+(Y+10+(H-16)*f).toFixed(1)+'" r="'+(1.3+f*1.1).toFixed(1)+'"/>').join("");
  return '<svg viewBox="0 0 112 158" role="img" aria-label="Stav sudu">'
  +'<defs>'
  +'<linearGradient id="kgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7c35a"/><stop offset="1" stop-color="#e8762d"/></linearGradient>'
  +'<linearGradient id="kgBL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a6b"/><stop offset="1" stop-color="#d9483b"/></linearGradient>'
  +'<linearGradient id="kgS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5d6672"/><stop offset=".35" stop-color="#c9d1da"/><stop offset=".6" stop-color="#8a94a0"/><stop offset="1" stop-color="#4a525c"/></linearGradient>'
  +'<linearGradient id="kgG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(255,255,255,.10)"/><stop offset=".3" stop-color="rgba(255,255,255,.02)"/><stop offset="1" stop-color="rgba(255,255,255,.07)"/></linearGradient>'
  +'<clipPath id="kgIn"><rect x="'+X+'" y="'+Y+'" width="'+W+'" height="'+H+'" rx="9"/></clipPath>'
  +'</defs>'
  +'<rect x="'+X+'" y="'+Y+'" width="'+W+'" height="'+H+'" rx="9" fill="url(#kgG)"/>'
  +'<g clip-path="url(#kgIn)"><g class="kg-liq">'
  +  '<rect class="kg-beer" x="'+X+'" y="'+Y+'" width="'+W+'" height="'+(H+4)+'" fill="url(#kgB)"/>'
  +  '<path d="M'+X+' '+(Y+1)+' q 6 -6 12 0 t 12 0 t 12 0 t 12 0 t 14 0 v 6 h -'+W+' z" fill="#fff6e2" opacity=".92"/>'
  +  bub
  +'</g><rect x="'+(X+7)+'" y="'+Y+'" width="7" height="'+H+'" fill="rgba(255,255,255,.12)"/></g>'
  +'<line x1="'+(X+W+9)+'" y1="'+Y+'" x2="'+(X+W+9)+'" y2="'+(Y+H)+'" class="kg-t2"/>'
  +'<text x="'+(X+W+21)+'" y="'+(Y-8)+'" class="kg-tl kg-unit">litry</text>'+ticks
  +'<rect x="'+X+'" y="'+Y+'" width="'+W+'" height="'+H+'" rx="9" fill="none" stroke="url(#kgS)" stroke-width="3"/>'
  +'<rect x="'+(X-3)+'" y="'+(Y+H*0.30)+'" width="'+(W+6)+'" height="5" rx="2.5" fill="url(#kgS)" opacity=".9"/>'
  +'<rect x="'+(X-3)+'" y="'+(Y+H*0.68)+'" width="'+(W+6)+'" height="5" rx="2.5" fill="url(#kgS)" opacity=".9"/>'
  +'<path d="M'+(X-4)+' '+(Y-2)+' h '+(W+8)+' a4 4 0 0 1 4 4 v 8 h -'+(W+16)+' v -8 a4 4 0 0 1 4 -4 z" fill="url(#kgS)"/>'
  +'<rect x="'+(X+8)+'" y="'+(Y+1)+'" width="14" height="5" rx="2.5" fill="#0d0f13"/><rect x="'+(X+W-22)+'" y="'+(Y+1)+'" width="14" height="5" rx="2.5" fill="#0d0f13"/>'
  +'<rect x="'+(X+W/2-7)+'" y="'+(Y-8)+'" width="14" height="7" rx="2" fill="url(#kgS)"/>'
  +'<path d="M'+(X-8)+' '+(Y+H-4)+' h '+(W+16)+' v 8 a4 4 0 0 1 -4 4 h -'+(W+8)+' a4 4 0 0 1 -4 -4 z" fill="url(#kgS)"/>'
  +'<g class="kg-lvl"><rect x="'+(X+W/2-19)+'" y="0" width="38" height="16" rx="8" fill="rgba(10,12,16,.82)" stroke="rgba(255,255,255,.25)"/>'
  +'<text class="kg-lvt" x="'+(X+W/2)+'" y="11.5" text-anchor="middle"></text></g>'
  +'</svg>';
}
function setKegLevel(box,size,leftL){
  const {Y,H}=KG, p=Math.max(0,Math.min(1,leftL/size)), low=p<0.2;
  const liq=box.querySelector(".kg-liq"), lvl=box.querySelector(".kg-lvl");

// ---- medaile síně slávy (stejný výpočet jako v aplikaci – kopie renderHallFun z index.html) ----
const EVE_GAP=6*HOUR, PRICE=40;
const plSmall=n=>n===1?"malé":(n>=2&&n<=4?"malá":"malých");
const plDay=n=>n===1?"den":(n>=2&&n<=4?"dny":"dní");

function marksTotal(marks){ return (marks||[]).reduce((s,m)=>s+((m&&m.p)||PRICE),0); }
function medalItems(pays,since){
  // jméno → čárky od obnovy síně slávy: zaplacené i ty, co jsou zrovna rozpité na otevřených lístcích
  // (jen čárky se známým časem; zaplacením se čárky z lístku přesunou do platby, takže se nepočítají dvakrát)
  const per={}, add=(nm,m)=>{ if(m && m.t>0 && m.t>=since) (per[nm]||(per[nm]=[])).push(m); };
  (pays||[]).forEach(r=>{ if(Array.isArray(r.mk)) r.mk.forEach(m=>add(r.name||"?",m)); });
  Object.keys(TABS).forEach(n=>tabMarks(TABS[n]).forEach(m=>add(n,m)));
  const best=(fn,minV,cmp)=>{ let w=null,v=null; Object.keys(per).sort((a,b)=>a.localeCompare(b,"cs")).forEach(n=>{
      const x=fn(per[n].slice().sort((a,b)=>a.t-b.t)); if(x==null || x<minV) return;
      if(v==null || (cmp==="min"?x<v:x>v)){ v=x; w=n; } }); return w?{who:w,v}:null; };
  const gaps=ms=>{ const g=[]; for(let i=1;i<ms.length;i++){ const d=ms[i].t-ms[i-1].t; if(d<=EVE_GAP) g.push(d); } return g; };
  const evDay=t=>{ const d=new Date(t-6*HOUR); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); };
  const items=[];
  let r=best(ms=>{ const g=gaps(ms).filter(d=>d>=5*MIN); return g.length?Math.min(...g):null; },0,"min");
  if(r) items.push(["⚡","Nejrychlejší pivo",r.who,'další pivo za <b>'+fmtDur(r.v)+'</b>']);
  r=best(ms=>new Set(ms.map(m=>evDay(m.t))).size,2);
  if(r) items.push(["🗓️","Nejvěrnější štamgast",r.who,'<b>'+r.v+'</b> '+(r.v>=5?"večerů":"večery")]);
  r=best(ms=>ms.filter(m=>m.s==="small").length,1);
  if(r) items.push(["🍼","Král malých piv",r.who,'<b>'+r.v+'</b> '+plSmall(r.v)]);
  r=best(ms=>ms.filter(m=>{ const h=new Date(m.t).getHours(); return h>=0&&h<5; }).length,1);
  if(r) items.push(["🦉","Noční sova",r.who,'<b>'+r.v+'</b> '+plBeer(r.v)+' po půlnoci']);
  // 🌅 / 🌃 nejdřívější a nejpozdější pivo dne podle hodin. Den začíná v 6:00 ráno, takže pivo
  // v 1:30 po půlnoci je „pozdní“ (patří k předchozímu večeru), ne „ranní“.
  const dayPos=t=>{ const d=new Date(t-6*HOUR); return d.getHours()*60+d.getMinutes()+d.getSeconds()/60; };
  const atTxt=t=>{ const d=new Date(t); return '<b>'+d.getHours()+':'+p2(d.getMinutes())+'</b> ('+d.getDate()+'. '+(d.getMonth()+1)+'.)'; };
  let early=null, late=null;
  Object.keys(per).sort((a,b)=>a.localeCompare(b,"cs")).forEach(n=>per[n].forEach(m=>{ const v=dayPos(m.t);
    if(!early || v<early.v) early={who:n,v,t:m.t};
    if(!late || v>late.v) late={who:n,v,t:m.t}; }));
  if(early) items.push(["🌅","Nejdřívější pivo dne",early.who,'pivo už v '+atTxt(early.t)]);
  if(late && (!early || late.t!==early.t)) items.push(["🌃","Nejpozdější pivo dne",late.who,'pivo ještě v '+atTxt(late.t)]);
  r=best(ms=>{ const g=gaps(ms); return g.length?Math.max(...g):null; },20*MIN);
  if(r) items.push(["🚽","Nejdelší pauza na záchod",r.who,'<b>'+fmtDur(r.v)+'</b> bez piva']);
  // večery jednoho člověka: evDay → seřazené čárky
  const eves=ms=>{ const g={}; ms.forEach(m=>(g[evDay(m.t)]||(g[evDay(m.t)]=[])).push(m)); return Object.values(g); };
  r=best(ms=>Math.max(...eves(ms).map(e=>e.length)),2);
  if(r) items.push(["🍺","Rekord večera",r.who,'<b>'+r.v+'</b> '+plBeer(r.v)+' za jeden večer']);
  // 🐢 Diesel: nejpomalejší průměrné tempo ve večerech, kdy dal aspoň 4 piva
  r=best(ms=>{ const iv=eves(ms).filter(e=>e.length>=4).map(e=>(e[e.length-1].t-e[0].t)/(e.length-1));
    return iv.length?iv.reduce((a,b)=>a+b,0)/iv.length:null; },0);
  if(r) items.push(["🐢","Diesel",r.who,'v průměru pivo za <b>'+fmtDur(r.v)+'</b>']);
  // 💸 Rychlý plátce: nejkratší průměrná doba od posledního piva na lístku po zaplacení
  const payDelay={};
  (pays||[]).forEach(r=>{ if(!Array.isArray(r.mk) || !r.ts || r.ts<since) return;
    const last=Math.max(0,...r.mk.map(m=>(m&&m.t)||0)); if(!last || r.ts<last) return;
    (payDelay[r.name||"?"]||(payDelay[r.name||"?"]=[])).push(r.ts-last); });
  let fast=null;
  Object.keys(payDelay).sort((a,b)=>a.localeCompare(b,"cs")).forEach(n=>{ const d=payDelay[n], v=d.reduce((a,b)=>a+b,0)/d.length;
    if(!fast || v<fast.v) fast={who:n,v}; });
  if(fast) items.push(["💸","Rychlý plátce",fast.who,'platí v průměru <b>'+(fast.v<MIN?"hned":fmtDur(fast.v))+'</b> po posledním pivu']);
  // 🧾 Nejstarší dluh: kdo má na otevřeném lístku nejstarší nezaplacenou čárku
  let debt=null;
  Object.keys(TABS).forEach(n=>{ const ts=tabMarks(TABS[n]).map(m=>m&&m.t).filter(t=>t>0); if(!ts.length) return;
    const t0=Math.min(...ts); if(!debt || t0<debt.t0) debt={who:n,t0,marks:tabMarks(TABS[n])}; });

    items.push([days>=7?"🕸️":"🧾","Nejstarší dluh",debt.who,'nezaplaceno <b>'+(days>=1?days+" "+plDay(days):fmtDur(age))+'</b> · '+c+' '+plBeer(c)+' · '+kc+' Kč']);
  }
  return items;
}
// ---- koláč síně slávy (kopie hallPart / renderHallPie z index.html) ----
function payCounts(r){ const small=r.small||0; return {small, large:(r.large!=null)?r.large:((r.beers||0)-small)}; }
function hallCounts(r){
  if(r.large!=null||r.small!=null) return {large:r.large||0, small:r.small||0};
  return {large:Math.round(r.beers||0), small:0};
}
function hallPart(r,since){
  const mk=Array.isArray(r.mk)?r.mk:[];
  // Časy čárek použijeme, jen když jsou úplné (počet sedí a žádný chybí);
  // jinak se jako dřív rozhoduje podle data platby
  const exact = mk.length>0 && mk.length===(r.beers||mk.length) && mk.every(m=>m && m.t>0);
  if(!exact){
    if(since && (r.ts||0)<since) return null;
    const c=payCounts(r); return {large:c.large, small:c.small, paid:r.amount||0};
  }
  const inn=mk.filter(m=>m.t>=since);
  if(!inn.length) return null;
  const small=inn.filter(m=>m.s==="small").length, large=inn.length-small;
  // Útrata jen za piva od obnovy; u platby přes obnovu poměrem (malé = 0,6 velkého)
  const w=arr=>arr.reduce((t,m)=>t+(m.s==="small"?0.6:1),0);
  const paid = inn.length===mk.length ? (r.amount||0) : Math.round((r.amount||0)*w(inn)/w(mk));
  return {large, small, paid};
}
let HP_SEL=null;   // vybraný (ťuknutý) výsek – jméno, přežije obnovení dat

function renderPie(){

function renderMedals(){

  const card=([i,l,w,v],k)=>'<div class="md" style="animation-delay:'+(k*0.08).toFixed(2)+'s"><span class="md-ico">'+i+'</span><div><div class="md-lbl">'+l+'</div><div class="md-who">'+esc(w)+'</div><div class="md-val">'+v+'</div></div></div>';
  setHTML($("#medL"), items.length ? '<div class="mt">🎖️ Medaile síně slávy</div>'+items.slice(0,half).map(card).join("") : "");
  setHTML($("#medR"), items.length>1 ? '<div class="mt">🎖️ Medaile síně slávy</div>'+items.slice(half).map((x,k)=>card(x,k+half)).join("") : "");
}
function tick(){
  const t=nextSession(), diff=t-new Date();
  setHTML($("#sessionWhen"),'📅 <span class="sess-day">'+DAY_NAMES[t.getDay()]+'</span> '+t.getDate()+". "+(t.getMonth()+1)+". "+t.getFullYear()+" · "+p2(t.getHours())+":"+p2(t.getMinutes()));
  if(diff<=0){ $("#clock").textContent="Je čas! 🍺"; return; }
  const dd=Math.floor(diff/86400000),hh=Math.floor(diff%86400000/3600000),mm=Math.floor(diff%3600000/60000),ss=Math.floor(diff%60000/1000);
  $("#clock").textContent=dd+" d "+hh+" h "+mm+" m "+ss+" s";
  const ok=LAST_OK && Date.now()-LAST_OK<5*MIN;
  $("#live").classList.toggle("off",!ok);
  $("#liveTxt").textContent= ok ? "živě · aktualizováno v "+fmtHM(LAST_OK) : (LAST_OK?"bez spojení · data z "+fmtHM(LAST_OK):"připojuji se…");
}
let busy=false, again=false;
async function refresh(){
  if(busy){ again=true; return; } busy=true;
  try{ await loadAll(); renderKeg(); renderMedals(); renderPie(); }catch(e){ /* zkusí se znovu při dalším obnovení */ }
  busy=false; tick(); if(again){ again=false; refresh(); }
}
// živé změny z databáze (čárka, platba, nový sud, změna termínu) + pojistka každou minutu
let rtT=null;
try{ const ch=sb.channel("tapeta"); ["tabs","suggestions"].forEach(t=>ch.on("postgres_changes",{event:"*",schema:"public",table:t},()=>{ clearTimeout(rtT); rtT=setTimeout(refresh,800); })); ch.subscribe(); }catch(e){}
setInterval(refresh,60000);
setInterval(()=>{ tick(); renderKeg(); renderMedals(); },1000*30);
setInterval(tick,1000);
// po probuzení počítače hned obnovit
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); });
tick(); refresh();

// ---- dočasný vzkaz: 5 minut od chvíle, kdy si ho tapeta stáhne (nejpozději do HEY_MAX), pak zase běžná tapeta ----
const HEY_FROM=1795550142003, HEY_LEN=5*MIN, HEY_MAX=HEY_FROM+16*MIN, PAGE_START=Date.now();
function heyActive(){
  const now=Date.now(); if(now<HEY_FROM || now>HEY_MAX) return false;
  let fs=0; try{ fs=+localStorage.getItem("studovna_hey3")||0; if(!fs){ fs=now; localStorage.setItem("studovna_hey3",String(fs)); } }catch(e){ fs=PAGE_START; }
  return now<fs+HEY_LEN;
}
function heyTick(){ $("#hey").classList.toggle("on",heyActive()); }
heyTick(); setInterval(heyTick,15000);

// ---- samoaktualizace: jednou za 10 minut se podívá, jestli na webu není nová verze tapety ----
// (Lively drží stránku otevřenou pořád, takže by se úpravy jinak projevily až po restartu)
let VER_BASE=null;
function verHash(t){ let h=0; for(let i=0;i<t.length;i++){ h=(h*31+t.charCodeAt(i))|0; } return h+":"+t.length; }
async function checkUpdate(){
  try{
    const r=await fetch(location.origin+location.pathname+"?v="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    const h=verHash(await r.text());
    if(VER_BASE===null){ VER_BASE=h; return; }
    if(h!==VER_BASE) location.replace(location.origin+location.pathname+"?t="+Date.now());   // nová verze → načíst znovu (obejde mezipaměť)
  }catch(e){ /* bez sítě nebo spuštěno ze souboru – zkusí se příště */ }
}
checkUpdate(); setInterval(checkUpdate,10*60000);
</script>
