name: Deploy na FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Nahrát na FTP server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vygenerovat seznam změn z historie commitů
        run: |
          git log --pretty=format:'%h%x1f%ad%x1f%s' --date=format:'%d. %m. %Y' -n 30 \
            | jq -R -s -c 'split("\n") | map(select(length>0) | split("")) | map({sha:.[0], date:.[1], message:.[2]})' \
            > changelog.json

      - name: Nahrát soubory přes FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
