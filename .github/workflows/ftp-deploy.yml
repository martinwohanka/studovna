name: Deploy na FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Nahrát na FTP server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vygenerovat seznam změn z historie commitů
        run: |
          # Verze se počítá z počtu commitů, ať se nezapomene zvýšit.
          # Setinky po 99 přetečou do další desítky: 99 commitů = v1.99, 100 = v2.00
          N=$(git rev-list --count HEAD)
          VERZE=$(printf 'v%d.%02d' $((1 + N/100)) $((N%100)))
          echo "verze: $VERZE (commitů: $N)"

          # Nejnovější commit je verze N, každý starší o jednu níž
          SEP=$'\x1f'
          git log --pretty=format:"%h${SEP}%ad${SEP}%s" --date=format:'%d. %m. %Y' -n 30 \
            | jq -R -s -c --arg sep "$SEP" --argjson n "$N" '
                split("\n") | map(select(length>0) | split($sep)) | to_entries
                | map(($n - .key) as $k | {
                    sha: .value[0], date: .value[1], message: .value[2],
                    version: ("v" + ((1 + ($k/100|floor))|tostring) + "." + (("0" + (($k%100)|tostring))[-2:]))
                  })' \
            > changelog.json

          if [ -f changelog-cs.json ]; then
            jq --slurpfile overrides changelog-cs.json \
              'map(. as $e | ($overrides[0][$e.sha] // $e.message) as $msg | $e + {message: $msg})' \
              changelog.json > changelog.tmp.json
            mv changelog.tmp.json changelog.json
          fi

          jq -c --arg v "$VERZE" '{version:$v, entries:.}' changelog.json > changelog.tmp.json
          mv changelog.tmp.json changelog.json

      - name: Nahrát soubory přes FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            changelog-cs.json
