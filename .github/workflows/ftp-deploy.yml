name: Deploy na FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Nahrát na FTP server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vygenerovat seznam změn z historie commitů
        run: |
          SEP=$'\x1f'
          git log --pretty=format:"%h${SEP}%ad${SEP}%s" --date=format:'%d. %m. %Y' -n 30 \
            | jq -R -s -c --arg sep "$SEP" 'split("\n") | map(select(length>0) | split($sep)) | map({sha:.[0], date:.[1], message:.[2]})' \
            > changelog.json

          if [ -f changelog-cs.json ]; then
            jq --slurpfile overrides changelog-cs.json \
              'map(. as $e | ($overrides[0][$e.sha] // $e.message) as $msg | $e + {message: $msg})' \
              changelog.json > changelog.tmp.json
            mv changelog.tmp.json changelog.json
          fi

      - name: Nahrát soubory přes FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            changelog-cs.json
