name: Deploy na FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Nahrát na FTP server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vygenerovat seznam změn z historie commitů
        run: |
          # Verze se bere z index.html (const APP_VERSION_CODE = "v1.36"), ne z počtu
          # commitů – ten se měnil i bez vydání a verze pak neodpovídala kódu.
          verze_v() { git show "$1:index.html" 2>/dev/null | grep -oP 'APP_VERSION_CODE\s*=\s*"\Kv\d+\.\d+' | head -1; }
          VERZE=$(verze_v HEAD)
          if [ -z "$VERZE" ]; then echo "::error::V index.html chybí const APP_VERSION_CODE"; exit 1; fi
          echo "verze: $VERZE"

          # Commity do v1.33 (33. commit) neměly verzi v kódu – ty číslujeme postaru
          # podle pořadí. Novější commit bez verze v kódu patří k nejbližší novější
          # verzi (je to rozpracovaná část vydání).
          LEGACY_MAX=33
          SEP=$'\x1f'
          CUR=""
          git log --pretty=tformat:"%H${SEP}%h${SEP}%ad${SEP}%s" --date=format:'%d. %m. %Y' -n 30 \
            | while IFS="$SEP" read -r full sha date msg; do
                N=$(git rev-list --count "$full")
                V=$(verze_v "$full")
                if [ -n "$V" ]; then CUR="$V"
                elif [ "$N" -le "$LEGACY_MAX" ]; then V=$(printf 'v%d.%02d' $((1 + N/100)) $((N%100)))
                else V="${CUR:-$VERZE}"; fi
                jq -n -c --arg sha "$sha" --arg date "$date" --arg message "$msg" --arg version "$V" \
                  '{sha:$sha, date:$date, message:$message, version:$version}'
              done \
            | jq -s -c . > changelog.json

          if [ -f changelog-cs.json ]; then
            jq --slurpfile overrides changelog-cs.json \
              'map(. as $e | ($overrides[0][$e.sha] // $e.message) as $msg | $e + {message: $msg})' \
              changelog.json > changelog.tmp.json
            mv changelog.tmp.json changelog.json
          fi

          jq -c --arg v "$VERZE" '{version:$v, entries:.}' changelog.json > changelog.tmp.json
          mv changelog.tmp.json changelog.json
          head -c 600 changelog.json; echo

      # SQL migrace se spouští ručně v Supabase a na web nepatří (*.sql je v exclude níže)
      - name: Nahrát soubory přes FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            changelog-cs.json
            **/*.sql
